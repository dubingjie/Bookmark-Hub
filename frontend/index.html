<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark-Hub · 书签收藏</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-gb-web@latest/lxgwwenkaigb-regular/result.css">
  <style>
    :root {
      --ink: #2D2B28;            /* 主文字 */
      --ink-light: #6B6560;      /* 次要文字 */
      --ink-faint: #9B9490;      /* 更弱文字 */
      --line: #E5E0D8;           /* 边框/分隔线 */
      --line-light: #EEEAE4;
      --accent: #DA7756;         /* 点缀色：暖赭 */
      --accent-hover: #C4684A;
      --bg: #FAF9F7;             /* 暖纸白 */
      --card: #FFFFFF;
      --card-hover: #FDF8F4;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.02);
      --shadow-hover: 0 4px 12px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.03);
      --grid-color: rgba(218, 119, 86, .07);
      --grid-color-strong: rgba(218, 119, 86, .12);
      --grid-size: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      color: var(--ink);
      font-family: "LXGW WenKai GB", "Kaiti SC", "STKaiti", "KaiTi", "楷体", serif;
      font-size: 16px;
      line-height: 1.7;
      background-color: var(--bg);
      /* 双层方格纸纹理：细格 24px + 粗格 96px，随页面固定 */
      background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
        linear-gradient(var(--grid-color-strong) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color-strong) 1px, transparent 1px);
      background-size:
        var(--grid-size) var(--grid-size),
        var(--grid-size) var(--grid-size),
        calc(var(--grid-size) * 4) calc(var(--grid-size) * 4),
        calc(var(--grid-size) * 4) calc(var(--grid-size) * 4);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }

    .page {
      max-width: 1160px;
      margin: 0 auto;
      padding: 40px;
      display: grid;
      grid-template-columns: 154px 1fr;
      gap: 70px;
      align-items: start;
    }
    @media (max-width: 768px) {
      .page { grid-template-columns: 1fr; padding: 24px; }
      .profile { position: static !important; }
    }

    /* ===== 左侧个人简介栏（参考 dubingjie.xyz 侧栏） ===== */
    .profile {
      position: sticky;
      top: 40px;
    }
    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .avatar {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--card);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      color: var(--accent);
      flex-shrink: 0;
    }
    .identity .name { font-size: 19px; letter-spacing: 2px; }
    .identity .caption {
      color: var(--ink-faint);
      font-size: 11px;
      letter-spacing: .12em;
      margin-top: 4px;
    }
    .profile .bio {
      font-size: 13px;
      color: var(--ink-light);
      line-height: 1.8;
      margin-bottom: 20px;
    }
    .profile .links { display: flex; flex-direction: column; gap: 6px; }
    .profile .links a {
      padding: 10px 12px;
      font-size: 14px;
      color: var(--ink-light);
      border-radius: 7px;
      transition: background .2s, color .2s;
    }
    .profile .links a:hover { background: var(--card-hover); color: var(--accent); }

    section { margin-bottom: 40px; }
    .section-title {
      font-size: 18px;
      letter-spacing: 3px;
      margin-bottom: 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .section-title::after {
      content: ""; flex: 1; height: 1px; background: var(--line);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line-light);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* ===== 热门榜单 ===== */
    .top-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .top-item {
      padding: 12px 14px;
      cursor: pointer;
      transition: box-shadow .2s, transform .2s;
    }
    .top-item:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
    .top-rank { color: var(--accent); font-size: 13px; letter-spacing: 1px; }
    .top-name {
      margin-top: 4px;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .empty { padding: 20px; text-align: center; color: var(--ink-faint); }

    /* ===== 检索（与列表属同一视觉单元，间距收紧） ===== */
    .search-bar { display: flex; gap: 12px; margin-bottom: 12px; }
    .search-bar input { flex: 1; }
    input, select {
      font-family: inherit;
      font-size: 15px;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(218, 119, 86, .12);
    }
    input::placeholder { color: var(--ink-faint); }

    /* ===== 表单（默认折叠，在搜索栏下方就地展开） ===== */
    .add-btn {
      flex-shrink: 0;
      padding: 9px 18px;
      color: var(--ink-light);
      border: 1px solid var(--line);
      background: var(--card);
    }
    .add-btn:hover { color: var(--accent); border-color: var(--accent); }
    .form-card { padding: 24px; margin-bottom: 12px; }
    .form-title { font-size: 17px; letter-spacing: 2px; margin-bottom: 16px; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .form-grid input { width: 100%; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }

    button {
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: var(--radius);
      padding: 9px 26px;
      transition: all .2s;
    }
    .btn-primary {
      background: var(--accent); color: #fff; border: 1px solid var(--accent);
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-plain {
      background: transparent; color: var(--ink-light); border: 1px solid var(--line);
    }
    .btn-plain:hover { color: var(--ink); border-color: var(--ink-faint); }

    /* ===== 书签列表 ===== */
    .bookmark-row {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line-light);
      transition: background .15s;
    }
    .bookmark-row:last-child { border-bottom: none; }
    .bookmark-row:hover { background: var(--card-hover); }
    .bm-main { flex: 1; min-width: 0; }
    .bm-title {
      font-size: 17px;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .bm-title:hover { color: var(--accent); border-bottom-color: var(--accent); }
    .bm-visits { font-size: 12px; color: var(--ink-faint); margin-left: 10px; }
    .bm-url, .bm-remark {
      font-size: 13px;
      color: var(--ink-faint);
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .bm-remark { color: var(--ink-light); }
    .bm-tags { margin-top: 6px; }
    .tag-chip {
      display: inline-block;
      font-size: 12px;
      color: var(--accent);
      border: 1px solid var(--line-light);
      border-radius: 999px;
      padding: 1px 12px;
      margin-right: 6px;
      background: var(--card-hover);
    }
    .bm-actions { flex-shrink: 0; }
    .bm-actions button {
      background: none; border: none;
      font-size: 14px; letter-spacing: 1px;
      color: var(--ink-faint);
      padding: 4px 8px;
    }
    .bm-actions button:hover { color: var(--accent); }
    .bm-actions .danger:hover { color: #b5433a; }
  </style>
</head>
<body>
<div id="app" class="page">

  <!-- ===== 左侧个人简介 ===== -->
  <aside class="profile">
    <div class="identity">
      <div class="avatar">书</div>
      <div>
        <div class="name">书签集</div>
        <div class="caption">BOOKMARK · HUB</div>
      </div>
    </div>
    <p class="bio">个人书签收藏夹，收录常用的开发文档与工具站点。</p>
    <nav class="links">
      <a href="https://github.com/dubingjie" target="_blank" rel="noopener">GitHub · dubingjie</a>
      <a href="https://dubingjie.xyz" target="_blank" rel="noopener">博客 · dubingjie.xyz</a>
    </nav>
  </aside>

  <main>

  <!-- ===== 热门 Top 10 ===== -->
  <section>
    <h2 class="section-title">热门排行</h2>
    <div v-if="top.length === 0" class="card empty">暂无访问数据，点击书签后开始统计</div>
    <div v-else class="top-grid">
      <div v-for="(b, i) in top" :key="b.id" @click="openBookmark(b)"
           class="card top-item">
        <div class="top-rank">№ {{ i + 1 }} · {{ b.visits }} 次</div>
        <div class="top-name" :title="b.title">{{ b.title }}</div>
      </div>
    </div>
  </section>

  <!-- ===== 检索 + 收录 + 书签列表（同一视觉单元） ===== -->
  <section>
    <div class="search-bar">
      <input v-model="keyword" @input="loadBookmarks" placeholder="搜索标题或备注 …">
      <select v-model="selectedTag" @change="loadBookmarks">
        <option value="">全部标签</option>
        <option v-for="t in tags" :key="t.id" :value="t.id">
          {{ t.name }}（{{ t.bookmark_count }}）
        </option>
      </select>
      <button @click="toggleForm" class="add-btn">{{ formOpen ? '收起' : '＋ 收录' }}</button>
    </div>

    <!-- 新增 / 编辑表单（默认折叠，就地展开） -->
    <div v-if="formOpen" class="card form-card" ref="formSection">
      <div class="form-title">{{ editingId ? '编辑书签' : '收录新书签' }}</div>
      <div class="form-grid">
        <input v-model="form.title" placeholder="标题 *">
        <input v-model="form.url" placeholder="网址 *（可省略 https://）">
        <input v-model="form.remark" placeholder="备注">
        <input v-model="form.tagsInput" placeholder="标签，逗号分隔（新标签自动创建）">
      </div>
      <button @click="saveBookmark" class="btn-primary">
        {{ editingId ? '保存修改' : '收录' }}
      </button>
      <button @click="resetForm" class="btn-plain">取消</button>
    </div>

    <div class="card">
      <div v-if="bookmarks.length === 0" class="empty">没有匹配的书签</div>
      <div v-for="b in bookmarks" :key="b.id" class="bookmark-row">
        <div class="bm-main">
          <span class="bm-title" @click="openBookmark(b)">{{ b.title }}</span>
          <span class="bm-visits">{{ b.visits }} 次访问</span>
          <div class="bm-url">{{ b.url }}</div>
          <div v-if="b.remark" class="bm-remark">{{ b.remark }}</div>
          <div v-if="b.tags.length" class="bm-tags">
            <span v-for="t in b.tags" :key="t.id" class="tag-chip">{{ t.name }}</span>
          </div>
        </div>
        <div class="bm-actions">
          <button @click="startEdit(b)">编辑</button>
          <button @click="removeBookmark(b)" class="danger">删除</button>
        </div>
      </div>
    </div>
  </section>

  </main>

</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      top: [],
      bookmarks: [],
      tags: [],
      keyword: '',
      selectedTag: '',
      editingId: null,
      formOpen: false,   // 表单默认折叠
      form: { title: '', url: '', remark: '', tagsInput: '' },
      lastVisit: {},   // { 书签id: 上次点击时间戳 }，用于 2 秒防抖
    };
  },
  methods: {
    async api(path, options) {
      const resp = await fetch(path, options);
      if (!resp.ok) throw new Error(`请求失败: ${resp.status}`);
      return resp.status === 204 ? null : resp.json();
    },
    async loadTop() {
      this.top = await this.api('/api/bookmarks/top?limit=10');
    },
    async loadTags() {
      this.tags = await this.api('/api/tags');
    },
    async loadBookmarks() {
      const params = new URLSearchParams();
      if (this.keyword.trim()) params.set('keyword', this.keyword.trim());
      if (this.selectedTag) params.set('tag_id', this.selectedTag);
      this.bookmarks = await this.api('/api/bookmarks?' + params);
    },
    openBookmark(b) {
      // 防抖：同一书签 2 秒内重复点击只生效一次
      const now = Date.now();
      if (this.lastVisit[b.id] && now - this.lastVisit[b.id] < 2000) return;
      this.lastVisit[b.id] = now;
      // 打开 /visit 网关而非真实 URL，让后端计数后 302 跳转
      window.open(`/api/bookmarks/${b.id}/visit`, '_blank');
      // 计数已变化，稍后刷新榜单和列表
      setTimeout(() => { this.loadTop(); this.loadBookmarks(); }, 1000);
    },
    toggleForm() {
      this.formOpen = !this.formOpen;   // 收起不会清空已填内容，方便临时收起再回来
    },
    async saveBookmark() {
      if (!this.form.title.trim() || !this.form.url.trim()) {
        alert('标题和网址不能为空');
        return;
      }
      const payload = {
        title: this.form.title,
        url: this.form.url,
        remark: this.form.remark || null,
        // 中英文逗号都支持，拆成标签名数组
        tags: this.form.tagsInput.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      };
      const isEdit = this.editingId !== null;
      await this.api(isEdit ? `/api/bookmarks/${this.editingId}` : '/api/bookmarks', {
        method: isEdit ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      this.resetForm();
      await Promise.all([this.loadBookmarks(), this.loadTags(), this.loadTop()]);
    },
    startEdit(b) {
      this.editingId = b.id;
      this.form = {
        title: b.title,
        url: b.url,
        remark: b.remark || '',
        tagsInput: b.tags.map(t => t.name).join(', '),
      };
      // 展开表单并滚动过去，等 DOM 更新后再滚
      this.formOpen = true;
      this.$nextTick(() => {
        this.$refs.formSection.scrollIntoView({ behavior: 'smooth' });
      });
    },
    async removeBookmark(b) {
      if (!confirm(`确认删除「${b.title}」？`)) return;
      await this.api(`/api/bookmarks/${b.id}`, { method: 'DELETE' });
      await Promise.all([this.loadBookmarks(), this.loadTags(), this.loadTop()]);
    },
    resetForm() {
      this.editingId = null;
      this.formOpen = false;
      this.form = { title: '', url: '', remark: '', tagsInput: '' };
    },
  },
  mounted() {
    this.loadTop();
    this.loadTags();
    this.loadBookmarks();
  },
}).mount('#app');
</script>
</body>
</html>
