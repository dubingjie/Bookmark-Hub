<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark-Hub</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
<div id="app" class="max-w-5xl mx-auto p-6">

  <h1 class="text-2xl font-bold mb-6">📚 Bookmark-Hub</h1>

  <!-- ===== 热门 Top 10 ===== -->
  <section class="mb-8">
    <h2 class="text-lg font-semibold mb-3">🔥 热门 Top 10</h2>
    <div v-if="top.length === 0" class="bg-white rounded shadow p-4 text-gray-400">
      暂无访问数据，点击书签后开始统计
    </div>
    <div v-else class="grid grid-cols-2 md:grid-cols-5 gap-3">
      <a v-for="(b, i) in top" :key="b.id" @click.prevent="openBookmark(b)"
         class="bg-white rounded shadow p-3 hover:shadow-md cursor-pointer block">
        <div class="text-xs text-orange-500 font-bold">#{{ i + 1 }} · {{ b.visits }} 次</div>
        <div class="font-medium truncate" :title="b.title">{{ b.title }}</div>
      </a>
    </div>
  </section>

  <!-- ===== 检索区 ===== -->
  <section class="bg-white rounded shadow p-4 mb-6 flex gap-3">
    <input v-model="keyword" @input="loadBookmarks"
           placeholder="搜索标题 / 备注..."
           class="border rounded px-3 py-2 flex-1">
    <select v-model="selectedTag" @change="loadBookmarks" class="border rounded px-3 py-2">
      <option value="">全部标签</option>
      <option v-for="t in tags" :key="t.id" :value="t.id">
        {{ t.name }} ({{ t.bookmark_count }})
      </option>
    </select>
  </section>

  <!-- ===== 新增 / 编辑表单 ===== -->
  <section class="bg-white rounded shadow p-4 mb-6">
    <h2 class="font-semibold mb-3">{{ editingId ? '编辑书签' : '新增书签' }}</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
      <input v-model="form.title" placeholder="标题 *" class="border rounded px-3 py-2">
      <input v-model="form.url" placeholder="网址 *（可省略 https://）" class="border rounded px-3 py-2">
      <input v-model="form.remark" placeholder="备注" class="border rounded px-3 py-2">
      <input v-model="form.tagsInput" placeholder="标签，用逗号分隔（新标签自动创建）"
             class="border rounded px-3 py-2">
    </div>
    <button @click="saveBookmark"
            class="bg-blue-500 text-white rounded px-4 py-2 hover:bg-blue-600 mr-2">
      {{ editingId ? '保存修改' : '添加' }}
    </button>
    <button v-if="editingId" @click="resetForm"
            class="bg-gray-300 rounded px-4 py-2 hover:bg-gray-400">取消</button>
  </section>

  <!-- ===== 书签列表 ===== -->
  <section class="bg-white rounded shadow">
    <div v-if="bookmarks.length === 0" class="p-4 text-gray-400">没有匹配的书签</div>
    <div v-for="b in bookmarks" :key="b.id"
         class="flex items-center gap-3 p-4 border-b last:border-b-0 hover:bg-gray-50">
      <div class="flex-1 min-w-0">
        <a @click.prevent="openBookmark(b)"
           class="font-medium text-blue-600 hover:underline cursor-pointer">{{ b.title }}</a>
        <span class="text-xs text-gray-400 ml-2">{{ b.visits }} 次访问</span>
        <div class="text-sm text-gray-500 truncate">{{ b.url }}</div>
        <div v-if="b.remark" class="text-sm text-gray-400 truncate">{{ b.remark }}</div>
        <div class="mt-1">
          <span v-for="t in b.tags" :key="t.id"
                class="inline-block bg-blue-100 text-blue-600 text-xs rounded px-2 py-0.5 mr-1">{{ t.name }}</span>
        </div>
      </div>
      <button @click="startEdit(b)" class="text-sm text-gray-500 hover:text-blue-500">编辑</button>
      <button @click="removeBookmark(b)" class="text-sm text-gray-500 hover:text-red-500">删除</button>
    </div>
  </section>

</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      top: [],
      bookmarks: [],
      tags: [],
      keyword: '',
      selectedTag: '',
      editingId: null,
      form: { title: '', url: '', remark: '', tagsInput: '' },
      lastVisit: {},   // { 书签id: 上次点击时间戳 }，用于 2 秒防抖
    };
  },
  methods: {
    async api(path, options) {
      const resp = await fetch(path, options);
      if (!resp.ok) throw new Error(`请求失败: ${resp.status}`);
      return resp.status === 204 ? null : resp.json();
    },
    async loadTop() {
      this.top = await this.api('/api/bookmarks/top?limit=10');
    },
    async loadTags() {
      this.tags = await this.api('/api/tags');
    },
    async loadBookmarks() {
      const params = new URLSearchParams();
      if (this.keyword.trim()) params.set('keyword', this.keyword.trim());
      if (this.selectedTag) params.set('tag_id', this.selectedTag);
      this.bookmarks = await this.api('/api/bookmarks?' + params);
    },
    openBookmark(b) {
      // 防抖：同一书签 2 秒内重复点击只生效一次
      const now = Date.now();
      if (this.lastVisit[b.id] && now - this.lastVisit[b.id] < 2000) return;
      this.lastVisit[b.id] = now;
      // 打开 /visit 网关而非真实 URL，让后端计数后 302 跳转
      window.open(`/api/bookmarks/${b.id}/visit`, '_blank');
      // 计数已变化，稍后刷新榜单和列表
      setTimeout(() => { this.loadTop(); this.loadBookmarks(); }, 1000);
    },
    async saveBookmark() {
      if (!this.form.title.trim() || !this.form.url.trim()) {
        alert('标题和网址不能为空');
        return;
      }
      const payload = {
        title: this.form.title,
        url: this.form.url,
        remark: this.form.remark || null,
        // 中英文逗号都支持，拆成标签名数组
        tags: this.form.tagsInput.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      };
      const isEdit = this.editingId !== null;
      await this.api(isEdit ? `/api/bookmarks/${this.editingId}` : '/api/bookmarks', {
        method: isEdit ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      this.resetForm();
      await Promise.all([this.loadBookmarks(), this.loadTags(), this.loadTop()]);
    },
    startEdit(b) {
      this.editingId = b.id;
      this.form = {
        title: b.title,
        url: b.url,
        remark: b.remark || '',
        tagsInput: b.tags.map(t => t.name).join(', '),
      };
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    async removeBookmark(b) {
      if (!confirm(`确认删除「${b.title}」？`)) return;
      await this.api(`/api/bookmarks/${b.id}`, { method: 'DELETE' });
      await Promise.all([this.loadBookmarks(), this.loadTags(), this.loadTop()]);
    },
    resetForm() {
      this.editingId = null;
      this.form = { title: '', url: '', remark: '', tagsInput: '' };
    },
  },
  mounted() {
    this.loadTop();
    this.loadTags();
    this.loadBookmarks();
  },
}).mount('#app');
</script>
</body>
</html>
